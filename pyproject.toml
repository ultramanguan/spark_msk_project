[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-lakehouse"
version = "0.1.0"
description = "Production AWS Databricks lakehouse pipeline: S3 + MSK Kafka + Delta Lake with Spark Structured Streaming."
requires-python = ">=3.10"
authors = [{name = "Data Engineering Team"}]
dependencies = [
  "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pyspark>=3.5.0",
  "delta-spark>=3.1.0",
  "build>=1.0",
  "ruff>=0.6.0",
]
kafka = [
  "kafka-python>=2.0.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
