bundle:
  name: retail_lakehouse
  databricks_cli_version: ">=0.236.0"

include:
  - resources/*.yml

variables:
  catalog:
    description: "Unity Catalog catalog for pipeline tables"
    default: "main"
  schema:
    description: "Schema/database for pipeline tables"
    default: "retail_lakehouse"
  base_path:
    description: "S3/DBFS base path for files and checkpoints"
    default: "dbfs:/tmp/retail_lakehouse/${workspace.current_user.short_name}"
  kafka_bootstrap_servers:
    description: "MSK bootstrap broker string; leave blank to skip the Kafka ingest task and use the file/rate fallback"
    default: ""
  kafka_topic:
    description: "MSK topic name"
    default: "retail-clickstream"

artifacts:
  default:
    type: whl
    path: .
    build: python -m build

targets:
  dev:
    mode: development
    default: true
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

  prod:
    mode: production
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
