resources:
  jobs:
    retail_lakehouse_pipeline:
      name: retail-lakehouse-pipeline-${bundle.target}
      max_concurrent_runs: 1
      environments:
        - environment_key: pipeline_env
          spec:
            client: "1"
            dependencies:
              - ../dist/*.whl
      tasks:
        - task_key: setup
          environment_key: pipeline_env
          notebook_task:
            notebook_path: ../notebooks/00_environment_setup.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              base_path: ${var.base_path}

        - task_key: batch_medallion
          depends_on:
            - task_key: setup
          environment_key: pipeline_env
          notebook_task:
            notebook_path: ../notebooks/01_batch_lakehouse_bronze_silver_gold.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              base_path: ${var.base_path}

        - task_key: streaming_ingest_fallback
          depends_on:
            - task_key: batch_medallion
          environment_key: pipeline_env
          notebook_task:
            notebook_path: ../notebooks/07_file_rate_streaming_fallback.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              base_path: ${var.base_path}
          # No MSK provisioned yet: runs the rate-source fallback instead of
          # notebooks/02_kafka_msk_streaming_ingest.py. Once infra/terraform is applied, swap this task
          # back to notebook 02 with kafka_bootstrap_servers/kafka_topic base_parameters.

        - task_key: streaming_silver_gold
          depends_on:
            - task_key: streaming_ingest_fallback
          environment_key: pipeline_env
          notebook_task:
            notebook_path: ../notebooks/03_streaming_silver_gold_delta.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              base_path: ${var.base_path}
              bronze_table: bronze_clickstream_rate

        - task_key: capstone
          depends_on:
            - task_key: streaming_silver_gold
          environment_key: pipeline_env
          notebook_task:
            notebook_path: ../notebooks/06_capstone_end_to_end.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              base_path: ${var.base_path}

